services:
  # Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: social_redis
    ports:
      - "6379:6379"

  # Distributed Storage
  mongodb:
    image: mongo:6
    container_name: social_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  # Event Streaming Queue (Confluent Local KRaft)
  kafka:
    image: confluentinc/confluent-local:7.5.0
    container_name: social_kafka
    ports:
      - "9092:9092"
