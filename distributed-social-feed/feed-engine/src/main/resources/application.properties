# Application Config
spring.application.name=feed-engine
server.port=8080

# MongoDB Distributed Storage Connection
spring.data.mongodb.uri=mongodb://admin:password@localhost:27017/socialfeed?authSource=admin

# Redis Distributed Cache Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Apache Kafka Event Stream Connection
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=social-feed-group
spring.kafka.consumer.auto-offset-reset=earliest